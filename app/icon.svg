<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- "NSZ" as outlines, not <text>. A favicon renders outside the document, so
       it can't reach a webfont — as live text the letterforms would fall back to
       whatever monospace the viewer's OS happens to provide, and shift between
       platforms. These are IBM Plex Mono Bold (SIL OFL), the face the site loads.

       Generated from the font's glyph outlines, with the transform derived from
       their combined ink bounds — so the mark is centred by construction rather
       than by a hand-tuned offset, and it can never re-flow.

       Palette hexes are inlined for the same reason as the font: nothing here
       can see :root. -->
  <defs>
    <linearGradient id="nsz" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7de3ff" />
      <stop offset="0.5" stop-color="#b967ff" />
      <stop offset="1" stop-color="#ff71ce" />
    </linearGradient>
  </defs>
